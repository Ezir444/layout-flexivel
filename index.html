<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Riot Login</title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>

        </header>
        <main class="container_principal">
            <div class="login_container">
                <div class="logo_container">
                    <img src="assets/img/riot-logo.png" alt="logo" class="logo">
                    <span>SIGN IN</span>
                    <input type="text" id="usuario" name="usuario" placeholder="USER" required class="user_input">
                    <input type="password" id="senha" name="senha" placeholder="PASSWORD" required class="password_input" >
                </div>
            
                <div class="senha_container">
                    <input type="checkbox" id="caixa_selecao" name="caixa_selecao">
                    <label for="caixa_selecao">Remenber Me</label>
                    <p class="forgot_password">Forgot Password?</p>
                </div>

                <div class="sign_in_container">
                    <button type="button" class="button_sign">SIGN IN</button>
                    <p>Don't have an accont? Sign Up</p>
                    <div class="linha"></div>
                    <p>Or Sign in With</p>
                </div>

                <div class="icon">
                    <button class="button_google"><img src="assets/icon/google.png" class="google_icon">
                    <button class="button_xbox"><img src="assets/icon/xbox.png" class="xbox_icon">
                </div>


            </div>
        </main>
    </body>
</html>
