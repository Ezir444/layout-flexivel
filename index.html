<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Riot Login</title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>

        </header>
        <main class="container_principal">
            <div class="login_container">
                <span>SIGN IN</span>
                <img src="assets/img/riot-logo.png" alt="logo" class="logo">
                <input type="text" id="usuario" name="usuario" placeholder="USER" required>
                <input type="password" id="senha" name="senha" placeholder="PASSWORD" required> 
            
            <div class="senha">
                <input type="checkbox" id="caixa_selecao" name="caixa_selecao">
                <label for="caixa_selecao">Remenber Me</label>
                <p>Forgot Password?</p>
            </div>

            <div class="sign_in">
                <button type="button" class="button_sign">SIGN IN</button>
                <p>Don't have an accont? Sign Up</p>
                <p>Or Sign in With</p>
            </div>

            <div class="icon">
                <img src="assets/icon/google.png" class="icones google_icon">
                <img src="assets/icon/xbox.png" class="icones xbox_icon">
            </div>


            </div>
        </main>
    </body>
</html>
